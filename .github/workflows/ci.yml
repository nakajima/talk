name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose --locked
      - name: Run tests
        run: cargo test --workspace --all-targets --verbose --locked

  c-backend:
    name: C backend differential
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build the compiler
        run: cargo build --release --locked
      # Compiles every program in the corpora through both targets and
      # fails on a single byte of disagreement. The default test suite
      # already gates bench/ and tests/programs/; this adds the reference
      # corpora and the examples.
      - name: Sweep the corpora through both targets
        run: ./scripts/c-backend-sweep.sh
      # The generated C is meant to be portable between the two compilers
      # anyone is likely to have.
      - name: Sweep again with clang
        run: ./scripts/c-backend-sweep.sh --cc clang

  talk-swift:
    name: TalkSwift
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build TalkC for the host
        run: cargo build -p talk-c --locked

      - name: Test TalkSwift with the host library
        run: swift test -Xlinker -L -Xlinker "$GITHUB_WORKSPACE/target/debug"

      - name: Build TalkC XCFramework
        run: ./talk-swift/scripts/build-xcframework.sh

      - name: Test TalkSwift with the XCFramework
        run: |
          swift package reset
          swift test

      - name: Build TalkSwift for iOS Simulator
        run: xcodebuild -scheme TalkSwift -destination "generic/platform=iOS Simulator" build
