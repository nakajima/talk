# cargo-make tasks for the Talk compiler.
#
# The compiled-module cache keys on the compiler's content identity, so
# every rebuild leaves the next `talk` invocation compiling core and the
# builtin packages from source (~40s in debug). `cargo make` after a
# build keeps the cache warm instead of discovering the cold start
# inside a test run or a REPL session.
#
# The TALK_CORE_PATH pin matters in linked worktrees: direnv from
# another checkout otherwise points core resolution at that checkout's
# sources. Builtin packages resolve against this checkout's packages/
# tree on their own.

[env]
TALK_CORE_PATH = "${CARGO_MAKE_WORKING_DIRECTORY}/core"

[tasks.default]
description = "Build the debug compiler and warm the compiled-module cache"
clear = true
workspace = false
dependencies = ["build", "warm"]

[tasks.build]
description = "Build the debug compiler"
command = "cargo"
args = ["build", "--locked"]

[tasks.warm]
description = "Warm the compiled-module cache for the current binary"
command = "target/debug/talk"
args = ["run", "examples/HelloWorld.tlk"]

[tasks.warm-release]
description = "Warm the compiled-module cache for the release binary"
dependencies = ["build-release"]
command = "target/release/talk"
args = ["run", "examples/HelloWorld.tlk"]

[tasks.build-release]
description = "Build the release compiler"
command = "cargo"
args = ["build", "--release", "--locked"]
