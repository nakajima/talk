<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>talktalk Playground - Focus</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link href="/reset.css" rel="stylesheet"><link href="/style.css" rel="stylesheet"><link href="/playground-options.css" rel="stylesheet">
  </head>
  <body>
    <nav class="global-nav" aria-label="Global navigation"><a class="global-nav-brand" href="/">talktalk</a><div class="global-nav-links"><a href="/">Language</a><a href="/playground" aria-current="page">Playground</a><a href="/qa">Q/A</a><a href="/philosophy">Philosophy</a></div></nav>
    <main class="playground-page focus-page playground-scope">
      <div class="playground-masthead">
        <div><span class="playground-eyebrow">Option 05 / Focus mode</span><h1>Just write.</h1></div>
        <span class="runtime-status">runtime loading</span>
      </div>
      <div class="focus-examples" aria-label="Starting points" data-example-catalog data-initial-example="copy-on-write"></div>
      <div class="playground-runner runnable">
        <section class="playground-editor">
          <div class="playground-panel-title"><strong>untitled.tlk</strong><span class="panel-label">autosaved locally someday</span></div>
          <div class="code-block"><pre class="code-highlight" aria-hidden="true"></pre><div class="code-diagnostics" aria-hidden="true"></div><textarea class="code-editable" rows="20" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off"></textarea></div>
          <div class="actions"><span class="action-control" data-tooltip="WASM bundle initializing" aria-label="WASM bundle initializing" tabindex="0"><button type="button" class="run" disabled>Run</button></span><span class="action-control" data-tooltip="WASM bundle initializing" aria-label="WASM bundle initializing" tabindex="0"><button type="button" class="lower" disabled>Lower</button></span><span class="action-control" data-tooltip="WASM bundle initializing" aria-label="WASM bundle initializing" tabindex="0"><button type="button" class="format" disabled>Format</button></span></div>
        </section>
        <section class="playground-output"><div class="playground-panel-title"><strong>Result</strong><span class="panel-label">quiet until needed</span></div><div class="result"></div><div class="output-empty">Command + Enter runs the current program.</div></section>
      </div>
    </main>
    <script type="module" src="/page.js"></script><script type="module" src="/playground-options.js"></script>
  </body>
</html>
